<!-- weather app -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-br from-blue-300 to-blue-700 min-h-screen">

    <div class="flex justify-center items-center min-h-screen">
        <div class="bg-white/20 backdrop-blur-lg rounded-3xl p-8 shadow-2xl w-[90%] max-w-[400px] text-white transition-all duration-500 hover:scale-105">
            <!-- Weather App -->
            <h1 class="text-3xl font-bold text-center mb-6">Weather App</h1>
            <!-- Search Bar -->
            <div class="flex gap-2 mb-6">
                <input id="cityInput" type="text" placeholder="Enter city" class="flex-1 px-4 py-3 rounded-xl outline-none text-black">
                <!-- Search History -->
                <div id="history" class="absolute top-40 left-3 w-[60%] bg-white/40 rounded-xl hidden z-40 ">
                    <!-- <div class="flex justify-between items-center">
                        <p class="text-sm text-gray-700 p-2">Suggestions: New York, London, Tokyo...</p>
                        <p class="text-sm text-gray-700 p-2">X</p>
                    </div> -->
                </div>
                <button id="searchBtn" class="bg-blue-500 px-5 py-3 rounded-xl hover:bg-blue-600 transition">Get Weather</button>
            </div>
            <!-- Loading -->
            <div id="loading" class="text-center hidden mt-4">
                <p class="text-white text-lg">Loading...</p>
            </div>
            <!-- Current Weather -->
            <div class="text-center">
                <div id="weatherIcon" class="text-7xl mb-4">Icon</div>
                <h2 id="temp" class="text-6xl font-bold">32°C</h2>
                <p id="cityName" class="text-2xl mt-2">Madurai</p>
                <p id="condition" class="text-lg text-gray-200">Cloudy</p>
            </div>
            <!-- Weather Details -->
            <div class="grid grid-cols-2 gap-4 mt-8">
                <div class="bg-white/20 p-4 rounded-2xl text-center">
                    <p class="text-sm">Humidity</p>
                    <h3 id="humidity" class="text-xl font-bold">60%</h3>
                </div>
                 <div class="bg-white/20 p-4 rounded-2xl text-center">
                    <p class="text-sm">Wind</p>
                    <h3 id="wind" class="text-xl font-bold">30 km/h</h3>
                </div>
                 <div class="bg-white/20 p-4 rounded-2xl text-center">
                    <p class="text-sm">Pressure</p>
                    <h3 id="pressure" class="text-xl font-bold">80 hPa</h3>
                </div>
                 <div class="bg-white/20 p-4 rounded-2xl text-center">
                    <p class="text-sm">Feels Like</p>
                    <h3 id="feelsLike" class="text-xl font-bold">50°C</h3>
                </div>
            </div>
            <!-- 5-Day Forecast -->
            <div class="mt-8">
                <h2 class="text-xl font-semibold mb-4">5-Day Forecast</h2>
                <div id="forecast" class="flex gap-3 overflow-x-auto scrollbar-none">
                    <!-- <div class="bg-white/20 min-w-[80px] p-3 rounded-2xl text-center">
                        <p>Mon</p>
                        <div class="text-2xl my-2">Icon</div>
                        <p>33°c</p>
                    </div>
                     <div class="bg-white/20 min-w-[80px] p-3 rounded-2xl text-center">
                        <p>Tue</p>
                        <div class="text-2xl my-2">Icon</div>
                        <p>33°c</p>
                    </div> -->
                </div>
            </div>
        </div>
    </div>

    <script src="./javascript/weatherscript.js"></script>
</body>

</html>
