<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <!-- Tailwind CSS cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Young+Serif&display=swap"
        rel="stylesheet">
    <!-- custom css -->
    <link rel="stylesheet" href="styles/indexstyle.css">
    <style>
        table,
        th,
        td {
            border: 2px solid black;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body class="font-serif font-weight:400 w-[100%] bg-gray-200 relative">

    <!-- navbar -->
    <section>

    </section>
    <!-- Search/Filter section -->
    <section>

    </section>
    <!-- Add task form -->
    <section class="hidden">
        <form action=""
            class="z-40 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-10 rounded-lg">
            <table>
                <tr>
                    <th> <label for="task-input">What is to be done?</label></th>
                    <td> <input type="text" id="task-input" placeholder="Enter task here"></td>
                </tr>
                <tr>
                    <th> <label for="due-date">Due Date:</label></th>
                    <td><input type="datetime-local" id="due-date"></td>
                </tr>
                <tr>
                    <th><label for="category">Category:</label></th>
                    <td>
                        <select name="" id="select">
                            <option value="">Select category</option>
                            <option value="Personal">Personal</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Work">Work</option>
                            <option value="Other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center"><input type="submit" class="border p-2 rounded-lg"></td>
                </tr>
            </table>
        </form>
        <div id="overlay" class="bg-black w-[100%] h-[100%] absolute top-0 left-0 opacity-50 z-30"></div>
    </section>
    <!-- Task list display -->
    <!-- in progress task -->
    <section>
        <div class=" border rounded-lg w-[80%] relative h-auto bg-white m-auto mt-10 p-5 shadow-lg text-[2vw]">
            <h2 class="text-2xl font-bold text-center mb-4">In Progress</h2>
            <div class="w-[100%] h-[25vw] overflow-auto">
                <div class="w-[100%] flex flex-col items-center">
                    <div class="inprogress__task">
                        <div class="inprogress__category">
                            <p>category</p>
                        </div>
                        <div class="inprogress__content">
                            <input type="checkbox">
                            <h1>this is first task</h1>
                        </div>
                        <p class="inprogress__datetime">2024-07-01 17:00</p>
                        <button>Edit</button>
                    </div>
                    <div class="inprogress__task">
                        <div class="inprogress__category">
                            <p>category</p>
                        </div>
                        <div class="inprogress__content">
                            <input type="checkbox">
                            <h1>this is second task</h1>
                        </div>
                        <p class="inprogress__datetime">2024-07-01 17:00</p>
                        <button>Edit</button>
                    </div>
                    <div class="inprogress__task">
                        <div class="inprogress__category">
                            <p>category</p>
                        </div>
                        <div class="inprogress__content">
                            <input type="checkbox">
                            <h1>this is third task</h1>
                        </div>
                        <p class="inprogress__datetime">2024-07-01 17:00</p>
                        <button>Edit</button>
                    </div>
                </div>
            </div>

            <div class="w-[100%] h-auto mt-5 text-right">
                <button class="text-[4vw] font-bold border rounded-full pl-4 pr-4 cursor-pointer">+</button>
            </div>

        </div>
    </section>
    <!-- completed tasks -->
    <section>

    </section>

</body>

</html>
